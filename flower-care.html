<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>花卉养殖助手</title>
<style>
:root {
  --primary: #2e7d32;
  --primary-light: #4caf50;
  --primary-dark: #1b5e20;
  --accent: #66bb6a;
  --bg: #f1f8e9;
  --card: #ffffff;
  --text: #2e3b2e;
  --text-light: #6b7c6b;
  --border: #c8e6c9;
  --danger: #e53935;
  --warning: #f9a825;
  --info: #1976d2;
  --radius: 12px;
  --shadow: 0 2px 12px rgba(46,125,50,0.12);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
  overflow-x: hidden;
}

/* Header */
.header {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header h1 { font-size: 20px; font-weight: 600; display:flex; align-items:center; gap:8px; }
.header-btns { display:flex; gap:8px; }
.header-btn {
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.2s;
}
.header-btn:hover { background: rgba(255,255,255,0.35); }

/* Location Bar */
.location-bar {
  background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
  padding: 8px 20px;
  font-size: 13px;
  color: var(--primary-dark);
  display: flex;
  align-items: center;
  gap: 6px;
  border-bottom: 1px solid var(--border);
}
.location-bar .season-tag {
  background: var(--primary);
  color: white;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  margin-left: auto;
}

/* Tab Navigation */
.tab-nav {
  display: flex;
  background: var(--card);
  border-bottom: 2px solid var(--border);
  position: sticky;
  top: 56px;
  z-index: 99;
}
.tab-btn {
  flex: 1;
  padding: 12px 8px;
  text-align: center;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-light);
  border: none;
  background: none;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.tab-btn.active {
  color: var(--primary);
  font-weight: 600;
}
.tab-btn.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 20%;
  right: 20%;
  height: 3px;
  background: var(--primary);
  border-radius: 3px 3px 0 0;
}
.tab-btn .badge {
  background: var(--danger);
  color: white;
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 8px;
  margin-left: 4px;
  vertical-align: top;
}

/* Tab Content */
.tab-content { display: none; padding: 16px; padding-bottom: 80px; }
.tab-content.active { display: block; }

/* Season Filter */
.season-filter {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.season-btn {
  padding: 6px 16px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--card);
  color: var(--text-light);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.season-btn.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

/* Flower Card */
.flower-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.flower-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
  position: relative;
}
.flower-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(46,125,50,0.2); }
.flower-card.dragging { opacity: 0.4; transform: scale(0.95); }
.flower-card.drag-over { border: 2px dashed var(--primary-light); transform: translateY(-2px); }
.flower-card .drag-handle {
  position: absolute; top: 4px; right: 4px; width: 24px; height: 24px;
  background: rgba(255,255,255,0.85); border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 14px; cursor: grab;
  box-shadow: 0 1px 4px rgba(0,0,0,0.15); z-index: 2; color: var(--text-light);
  transition: background 0.2s;
}
.flower-card .drag-handle:active { cursor: grabbing; background: var(--border); }
.flower-card .flower-img {
  width: 100%;
  height: 130px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.flower-card .flower-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s;
}
.flower-card:hover .flower-img img { transform: scale(1.05); }
.flower-card .flower-img .emoji-fallback {
  font-size: 56px;
  position: absolute;
}
.flower-card .flower-info { padding: 10px 12px; }
.flower-card .flower-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.flower-card .flower-desc { font-size: 12px; color: var(--text-light); line-height: 1.5; }
.flower-card .add-btn {
  margin: 0 12px 10px;
  padding: 5px 0;
  width: calc(100% - 24px);
  background: var(--primary-light);
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  transition: background 0.2s;
}
.flower-card .add-btn:hover { background: var(--primary); }
.flower-card .add-btn.added { background: #bdbdbd; cursor: default; }

/* Knowledge Section */
.knowledge-section {
  margin-top: 20px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.knowledge-header {
  padding: 12px 16px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  font-weight: 600;
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.knowledge-item {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.15s;
}
.knowledge-item:hover { background: #f1f8e9; }
.knowledge-item:last-child { border-bottom: none; }
.knowledge-item .ki-title {
  font-size: 14px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.knowledge-item .ki-desc { font-size: 12px; color: var(--text-light); }
.knowledge-item .ki-arrow { margin-left: auto; color: var(--text-light); font-size: 12px; }

/* Modal / Detail */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal-content {
  background: var(--card);
  border-radius: 16px 16px 0 0;
  width: 100%;
  max-width: 480px;
  max-height: 85vh;
  overflow-y: auto;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-header {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--card);
  z-index: 1;
}
.modal-header h2 { font-size: 17px; }
.modal-close {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: none;
  background: #f5f5f5;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-body { padding: 16px 20px 24px; }

/* Detail sections */
.detail-section {
  margin-bottom: 16px;
  padding: 12px;
  background: #f9fbe7;
  border-radius: 8px;
  border-left: 3px solid var(--primary-light);
}
.detail-section h3 {
  font-size: 14px;
  color: var(--primary-dark);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.detail-section p, .detail-section li {
  font-size: 13px;
  line-height: 1.7;
  color: var(--text);
}
.detail-section ul { padding-left: 18px; }

/* Season tabs inside detail */
.detail-season-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}
.detail-season-tab {
  padding: 4px 12px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: white;
  font-size: 12px;
  cursor: pointer;
}
.detail-season-tab.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

/* My Flower List */
.my-flower-item {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 12px;
  overflow: hidden;
}
.my-flower-header {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  gap: 12px;
  cursor: pointer;
}
.my-flower-emoji { font-size: 36px; width:48px; height:48px; border-radius:8px; overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.my-flower-emoji img { width:100%; height:100%; object-fit:cover; }
.my-flower-meta { flex: 1; }
.my-flower-name { font-size: 15px; font-weight: 600; }
.my-flower-status { font-size: 12px; color: var(--text-light); margin-top: 2px; }
.my-flower-status-sub { font-size: 11px; color: var(--text-light); margin-top: 1px; opacity: 0.8; }
.climate-banner { background: linear-gradient(135deg, #e8f5e9, #c8e6c9); border-radius: 10px; padding: 8px 14px; font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; line-height: 1.5; }
.climate-adjusted { font-size: 10px; margin-left: 2px; cursor: help; opacity: 0.7; }
.my-flower-actions { display: flex; gap: 6px; }
.my-flower-actions button {
  padding: 4px 10px;
  border-radius: 14px;
  border: none;
  font-size: 11px;
  cursor: pointer;
  transition: opacity 0.2s;
}
.my-flower-actions button:hover { opacity: 0.8; }
.btn-water { background: #e3f2fd; color: #1565c0; }
.btn-fertilize { background: #fff3e0; color: #e65100; }
.btn-remove { background: #ffebee; color: #c62828; }

/* Reminder Cards */
.reminder-card {
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
}
.reminder-card.overdue { background: #fff3e0; }
.reminder-card.today { background: #e8f5e9; }
.reminder-icon { font-size: 18px; }
.reminder-text { flex: 1; }
.reminder-text .rt-label { font-weight: 500; }
.reminder-text .rt-days { font-size: 11px; color: var(--text-light); }
.reminder-action {
  padding: 4px 10px;
  border-radius: 14px;
  border: none;
  font-size: 11px;
  cursor: pointer;
  background: var(--primary-light);
  color: white;
}

/* Auth Page */
.auth-page {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg);
  z-index: 300;
  max-width: 480px;
  margin: 0 auto;
}
.auth-page.show { display: flex; flex-direction: column; }
.auth-header {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white;
  padding: 40px 24px 30px;
  text-align: center;
}
.auth-header h1 { font-size: 26px; margin-bottom: 8px; display:flex; align-items:center; justify-content:center; gap:10px; }
.auth-header p { font-size: 14px; opacity: 0.9; }
.auth-form {
  flex: 1;
  padding: 30px 24px;
}
.auth-form h2 { font-size: 20px; margin-bottom: 20px; color: var(--primary-dark); }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-light); }
.form-group input {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 15px;
  transition: border-color 0.2s;
  background: white;
}
.form-group input:focus { outline: none; border-color: var(--primary); }
.auth-submit {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
  transition: opacity 0.2s;
}
.auth-submit:hover { opacity: 0.9; }
.auth-switch {
  text-align: center;
  margin-top: 16px;
  font-size: 13px;
  color: var(--text-light);
}
.auth-switch a { color: var(--primary); cursor: pointer; text-decoration: none; }
.auth-error {
  background: #ffebee;
  color: #c62828;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 13px;
  margin-bottom: 12px;
  display: none;
}

/* Empty State */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-light);
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; margin-bottom: 16px; }
.empty-state button {
  padding: 10px 24px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 20px;
  font-size: 14px;
  cursor: pointer;
}

/* Search Bar */
.search-bar {
  display: flex;
  align-items: center;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 8px 14px;
  margin-bottom: 14px;
  gap: 8px;
}
.search-bar input {
  flex: 1;
  border: none;
  outline: none;
  font-size: 14px;
  background: none;
}
.search-bar .search-icon { color: var(--text-light); }

/* Notification toast */
.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--primary-dark);
  color: white;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 500;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* Knowledge detail page */
.knowledge-detail-page {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg);
  z-index: 250;
  max-width: 480px;
  margin: 0 auto;
  overflow-y: auto;
}
.knowledge-detail-page.show { display: block; }
.kd-header {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 1;
}
.kd-header button {
  background: none;
  border: none;
  color: white;
  font-size: 18px;
  cursor: pointer;
}
.kd-header h2 { font-size: 17px; }
.kd-body { padding: 16px 20px 80px; }

/* Care schedule display */
.schedule-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin: 12px 0;
}
.schedule-item {
  text-align: center;
  padding: 8px 4px;
  border-radius: 8px;
  background: white;
  border: 1px solid var(--border);
}
.schedule-item .si-icon { font-size: 20px; }
.schedule-item .si-label { font-size: 10px; color: var(--text-light); margin-top: 2px; }
.schedule-item .si-value { font-size: 13px; font-weight: 600; color: var(--primary); }

/* Responsive */
@media (min-width: 481px) {
  body { box-shadow: 0 0 20px rgba(0,0,0,0.1); }
}

/* Profile Page */
.profile-page {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg);
  z-index: 250;
  max-width: 480px;
  margin: 0 auto;
  overflow-y: auto;
}
.profile-page.show { display: block; }
.profile-header {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 1;
}
.profile-header button {
  background: none;
  border: none;
  color: white;
  font-size: 18px;
  cursor: pointer;
}
.profile-header h2 { font-size: 17px; }
.profile-avatar {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: linear-gradient(135deg, #81c784, #388e3c);
  color: white;
  font-size: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 24px auto 12px;
  box-shadow: 0 4px 12px rgba(46,125,50,0.3);
}
.profile-username {
  text-align: center;
  font-size: 18px;
  font-weight: 600;
  color: var(--primary-dark);
  margin-bottom: 4px;
}
.profile-city {
  text-align: center;
  font-size: 13px;
  color: var(--text-light);
  margin-bottom: 24px;
}
.profile-section {
  background: var(--card);
  margin: 0 16px 12px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.profile-section-title {
  padding: 12px 16px 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-light);
}
.profile-item {
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.15s;
}
.profile-item:hover { background: #f1f8e9; }
.profile-item:last-child { border-bottom: none; }
.profile-item .pi-icon { font-size: 20px; width: 28px; text-align: center; }
.profile-item .pi-label { flex: 1; font-size: 14px; }
.profile-item .pi-value { font-size: 13px; color: var(--text-light); }
.profile-item .pi-arrow { color: var(--text-light); font-size: 12px; }

/* Profile Edit Modal */
.profile-edit-modal {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg);
  z-index: 260;
  max-width: 480px;
  margin: 0 auto;
  overflow-y: auto;
}
.profile-edit-modal.show { display: block; }
.pem-header {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 1;
}
.pem-header button {
  background: none;
  border: none;
  color: white;
  font-size: 18px;
  cursor: pointer;
}
.pem-header h2 { font-size: 17px; }
.pem-body { padding: 24px 20px; }
.pem-body .form-group { margin-bottom: 18px; }
.pem-body .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: var(--text); }
.pem-body .form-group input {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 15px;
  transition: border-color 0.2s;
  background: white;
}
.pem-body .form-group input:focus { outline: none; border-color: var(--primary); }
.pem-body .auth-submit { margin-top: 16px; }
.pem-success {
  background: #e8f5e9;
  color: var(--primary-dark);
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 13px;
  margin-bottom: 12px;
  display: none;
  text-align: center;
}

/* Detail photo gallery */
.detail-photos {
  display: flex;
  gap: 6px;
  margin: 12px 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.detail-photo-item {
  flex: 0 0 auto;
  width: 140px;
  height: 105px;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  cursor: pointer;
  transition: transform 0.2s;
}
.detail-photo-item:hover { transform: scale(1.03); }
.detail-photo-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.detail-photo-item .photo-label {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: linear-gradient(transparent, rgba(0,0,0,0.6));
  color: white;
  font-size: 11px;
  padding: 12px 8px 4px;
  text-align: center;
}

/* Photo lightbox */
.lightbox {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.92);
  z-index: 500;
  align-items: center;
  justify-content: center;
  max-width: 480px;
  margin: 0 auto;
}
.lightbox.show { display: flex; }
.lightbox img {
  max-width: 95%;
  max-height: 80vh;
  object-fit: contain;
  border-radius: 8px;
}
.lightbox-close {
  position: absolute;
  top: 12px;
  right: 16px;
  color: white;
  font-size: 28px;

<script>
// ==================== API LAYER ====================
const API = window.location.protocol === 'file:' ? 'http://localhost:8765' : '';

let _serverDown = false;

async function api(path, options = {}) {
  let resp;
  try {
    resp = await fetch(API + path, {
      headers: { 'Content-Type': 'application/json' },
      ...options,
      body: options.body ? JSON.stringify(options.body) : undefined
    });
  } catch (e) {
    _serverDown = true;
    showServerDownBanner();
    throw new Error('无法连接服务器');
  }
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error || '请求失败');
  return data;
}

function showServerDownBanner() {
  if (document.getElementById('serverDownBanner')) return;
  const banner = document.createElement('div');
  banner.id = 'serverDownBanner';
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:10000;background:#ff4444;color:#fff;padding:12px 16px;font-size:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.3);';
  banner.innerHTML = '服务器未启动，请双击 <b>启动花卉助手.bat</b> 启动服务器 <button onclick="this.parentElement.remove()" style="margin-left:16px;background:rgba(255,255,255,.3);border:none;color:#fff;padding:2px 12px;border-radius:4px;cursor:pointer;">关闭</button>';
  document.body.appendChild(banner);
}

// ==================== STATE ====================
let currentUser = null;  // { id, username, city }
let allFlowers = [];     // Cache from server
let currentSeason = 'all';
let locationData = { city: '未知', lat: null, lng: null };

// ==================== SEASON HELPERS ====================
function getCurrentSeason() {
  const month = new Date().getMonth() + 1;
  if (month >= 3 && month <= 5) return 'spring';
  if (month >= 6 && month <= 8) return 'summer';
  if (month >= 9 && month <= 11) return 'autumn';
  return 'winter';
}
function getSeasonName(s) {
  return { spring: '春季', summer: '夏季', autumn: '秋季', winter: '冬季' }[s] || s;
}
function getSeasonEmoji(s) {
  return { spring: '🌸', summer: '☀️', autumn: '🍂', winter: '❄️' }[s] || '';
}
function adjustWaterDays(baseDays, season, city) {
  // Deprecated - now using server-side climate adjustment
  // Kept as fallback for knowledge tab only
  return baseDays;
}

// ==================== AUTH ====================
function showLogin() {
  document.getElementById('loginForm').style.display = '';
  document.getElementById('registerForm').style.display = 'none';
}
function showRegister() {
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('registerForm').style.display = '';
}

async function handleLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  if (!username || !password) { showAuthError('loginError', '请填写用户名和密码'); return; }
  try {
    const data = await api('/api/login', { method: 'POST', body: { username, password } });
    currentUser = data.user;
    localStorage.setItem('flower_user', JSON.stringify(currentUser));
    enterApp();
  } catch (e) {
    showAuthError('loginError', e.message);
  }
}

async function handleRegister() {
  const username = document.getElementById('regUser').value.trim();
  const password = document.getElementById('regPass').value;
  const password2 = document.getElementById('regPass2').value;
  const city = document.getElementById('regCity').value.trim();
  if (!username || username.length < 3) { showAuthError('regError', '用户名至少3个字符'); return; }
  if (!password || password.length < 6) { showAuthError('regError', '密码至少6位'); return; }
  if (password !== password2) { showAuthError('regError', '两次密码不一致'); return; }
  try {
    const data = await api('/api/register', { method: 'POST', body: { username, password, city } });
    currentUser = data.user;
    localStorage.setItem('flower_user', JSON.stringify(currentUser));
    if (city) { locationData.city = city; updateLocationBar(); }
    enterApp();
    showToast('注册成功，欢迎！');
  } catch (e) {
    showAuthError('regError', e.message);
  }
}

function handleLogout() {
  currentUser = null;
  localStorage.removeItem('flower_user');
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('authPage').classList.add('show');
}

function showAuthError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}

// ==================== APP ENTRY ====================
async function enterApp() {
  document.getElementById('authPage').classList.remove('show');
  document.getElementById('mainApp').style.display = '';
  if (currentUser && currentUser.city) {
    locationData.city = currentUser.city;
  }
  initLocation();
  await loadFlowers();
  await renderMyFlowers();  // Populate _myFlowerIds first
  renderFlowerGrid();
  renderReminders();
  updateBadge();
}

async function loadFlowers() {
  try {
    const data = await api('/api/flowers');
    allFlowers = data.flowers;
    // Apply saved order
    let order = null;
    // Try server order if logged in
    if (currentUser) {
      try {
        const od = await api(`/api/user/${currentUser.id}/flower-order`);
        if (od.order && od.order.length > 0) order = od.order;
      } catch(e) {}
    }
    // Fallback to localStorage
    if (!order) {
      const saved = localStorage.getItem('flower_order');
      if (saved) { try { order = JSON.parse(saved); } catch(e) {} }
    }
    if (order && Array.isArray(order) && order.length > 0) {
      const ordered = [];
      const remaining = [...allFlowers];
      for (const id of order) {
        const idx = remaining.findIndex(f => f.flower_id === id);
        if (idx >= 0) ordered.push(remaining.splice(idx, 1)[0]);
      }
      allFlowers = [...ordered, ...remaining];
    }
  } catch (e) {
    console.error('加载花卉失败:', e);
    allFlowers = [];
  }
}

// ==================== LOCATION & SEASON ====================
function initLocation() {
  if (locationData.city && locationData.city !== '未知') {
    updateLocationBar();
    return;
  }
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        locationData.lat = pos.coords.latitude;
        locationData.lng = pos.coords.longitude;
        fetch(`https://nominatim.openstreetmap.org/reverse?lat=${locationData.lat}&lon=${locationData.lng}&format=json&accept-language=zh`)
          .then(r => r.json())
          .then(data => {
            if (data.address) {
              locationData.city = data.address.city || data.address.county || data.address.state || '未知';
            }
            updateLocationBar();
          })
          .catch(() => updateLocationBar());
      },
      () => updateLocationBar()
    );
  } else {
    updateLocationBar();
  }
}

function updateLocationBar() {
  document.getElementById('locationText').textContent = '📍 ' + locationData.city;
  const season = getCurrentSeason();
  document.getElementById('seasonTag').textContent = getSeasonEmoji(season) + ' ' + getSeasonName(season);
}

// ==================== TAB SWITCHING ====================
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  if (tab === 'knowledge') {
    document.getElementById('tabKnowledge').classList.add('active');
    document.getElementById('contentKnowledge').classList.add('active');
  } else if (tab === 'myflowers') {
    document.getElementById('tabMyflowers').classList.add('active');
    document.getElementById('contentMyflowers').classList.add('active');
    renderMyFlowers();
  } else if (tab === 'reminders') {
    document.getElementById('tabReminders').classList.add('active');
    document.getElementById('contentReminders').classList.add('active');
    renderReminders();
  }
}

// ==================== SEASON FILTER ====================
function filterSeason(season) {
  currentSeason = season;
  document.querySelectorAll('.season-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderFlowerGrid();
}

// ==================== FLOWER GRID ====================
let _dragSrcIdx = null;

function renderFlowerGrid() {
  const grid = document.getElementById('flowerGrid');
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const season = currentSeason;

  let filtered = allFlowers;
  if (search) {
    filtered = filtered.filter(f => f.name.includes(search) || (f.desc||'').includes(search) || f.flower_id.includes(search));
  }

  const city = currentUser ? currentUser.city : (locationData.city || '');
  const curSeason = getCurrentSeason();

  grid.innerHTML = filtered.map((f, idx) => {
    const isAdded = _myFlowerIds.includes(f.flower_id);
    const sd = season !== 'all' ? (f.seasons[season]||{}) : (f.seasons[curSeason]||{});
    const waterDisplay = sd.water || '';
    return `
      <div class="flower-card" data-idx="${idx}" data-id="${f.flower_id}" draggable="true"
           onclick="showFlowerDetail('${f.flower_id}')">
        <div class="drag-handle" title="拖拽排序" onclick="event.stopPropagation()">⠿</div>
        <div class="flower-img"><img src="${f.photo}" alt="${f.name}" onerror="this.style.display='none';this.parentElement.innerHTML='<span class=emoji-fallback>${f.emoji}</span>'"></div>
        <div class="flower-info">
          <div class="flower-name">${f.name}</div>
          <div class="flower-desc">${season !== 'all' ? '💧 ' + waterDisplay + ' · 🧪 ' + (sd.fertilize||'') : (f.desc||'')}</div>
        </div>
        <button class="add-btn ${isAdded ? 'added' : ''}" onclick="event.stopPropagation(); ${isAdded ? '' : "addMyFlower('" + f.flower_id + "')"}">
          ${isAdded ? '✓ 已添加' : '+ 加入我的花卉'}
        </button>
      </div>
    `;
  }).join('');

  // Setup drag events
  setupDragAndDrop(grid, filtered);
}

function setupDragAndDrop(grid, filtered) {
  const hasSearch = document.getElementById('searchInput').value.trim().length > 0;
  const cards = grid.querySelectorAll('.flower-card');
  cards.forEach(card => {
    card.addEventListener('dragstart', function(e) {
      _dragSrcIdx = parseInt(this.dataset.idx);
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', this.dataset.id);
    });
    card.addEventListener('dragend', function() {
      this.classList.remove('dragging');
      cards.forEach(c => c.classList.remove('drag-over'));
    });
    card.addEventListener('dragover', function(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      cards.forEach(c => c.classList.remove('drag-over'));
      this.classList.add('drag-over');
    });
    card.addEventListener('dragleave', function() {
      this.classList.remove('drag-over');
    });
    card.addEventListener('drop', function(e) {
      e.preventDefault();
      this.classList.remove('drag-over');
      const targetIdx = parseInt(this.dataset.idx);
      if (_dragSrcIdx === null || _dragSrcIdx === targetIdx) return;

      // Swap positions in allFlowers
      const draggedFlower = allFlowers.find(f => f.flower_id === filtered[_dragSrcIdx].flower_id);
      if (!draggedFlower) return;
      const srcId = filtered[_dragSrcIdx].flower_id;
      const tgtId = filtered[targetIdx].flower_id;
      const realSrc = allFlowers.findIndex(f => f.flower_id === srcId);
      const realTgt = allFlowers.findIndex(f => f.flower_id === tgtId);
      if (realSrc >= 0 && realTgt >= 0) {
        allFlowers.splice(realSrc, 1);
        allFlowers.splice(realTgt > realSrc ? realTgt - 1 : realTgt, 0, draggedFlower);
      }

      // Save order
      saveFlowerOrder();
      renderFlowerGrid();
    });
  });
}

function saveFlowerOrder() {
  const order = allFlowers.map(f => f.flower_id);
  localStorage.setItem('flower_order', JSON.stringify(order));
  // Also save to server if logged in
  if (currentUser) {
    api(`/api/user/${currentUser.id}/flower-order`, { method: 'PUT', body: { order } }).catch(() => {
      showToast('排序同步到服务器失败，已保存到本地');
    });
  }
}

    if (myFlowers.length === 0) {
      container.innerHTML = `

    container.innerHTML = myFlowers.map(mf => {

      const fertChanged = sd.fertilize_original && sd.fertilize && sd.fertilize !== sd.fertilize_original;

      let waterInterval = 5;
      const wm = adjWater.match(/(\d+)/);
      if (wm) waterInterval = parseInt(wm[1]);

      const daysSinceWater = mf.last_water ? Math.floor((Date.now() - new Date(mf.last_water).getTime()) / 86400000) : null;
      const waterStatus = daysSinceWater === null ? '尚未记录' :
        daysSinceWater >= waterInterval ? '⚠️ 需要浇水' :

      const waterDisplay = waterChanged ? `${adjWater}<span class="climate-adjusted" title="原标准: ${sd.water_original}">🔄</span>` : adjWater;
      const fertDisplay = fertChanged ? `${adjFert}<span class="climate-adjusted" title="原标准: ${sd.fertilize_original}">🔄</span>` : adjFert;

        <button class="btn-wp-done" style="padding:4px 12px;font-size:12px" onclick="regenPlans(${plantId})">🔄 重新生成计划</button>
        <button style="background:#ff5252;color:white;border:none;border-radius:4px;padding:4px 12px;font-size:12px;cursor:pointer" onclick="deletePlant(${plantId},'${plantName.replace(/'/g, "\\'")}')">🗑 删除植株</button>
      </div>
    `;

    // Show pending plans first (overdue + today + upcoming)
    const showPlans = [];
    // Overdue
    overdue.forEach(p => showPlans.push({...p, _class: 'overdue', _label: '逾期'}));
    // Today
    todayPlans.forEach(p => showPlans.push({...p, _class: 'today', _label: '今日'}));
    // Upcoming (next 14 days, pending only)
    const upcoming = pending.filter(p => p.plan_date > today).slice(0, 14);
    upcoming.forEach(p => {
      const days = Math.ceil((new Date(p.plan_date) - new Date(today)) / 86400000);
      showPlans.push({...p, _class: 'pending', _label: days + '天后'});
    });
    // Recent done (last 7)
    const recentDone = done.sort((a,b) => b.actual_date.localeCompare(a.actual_date)).slice(0, 7);
    recentDone.forEach(p => showPlans.push({...p, _class: 'done', _label: '已完成'}));

    if (showPlans.length === 0) {
      html += '<div style="text-align:center;color:#999;padding:20px">暂无浇水计划</div>';
    } else {
      html += '<div style="font-size:13px;font-weight:600;margin-bottom:6px;color:#333">📋 浇水计划</div>';
      html += showPlans.map(p => {
        const dateStr = p.plan_date;
        const weekday = ['日','一','二','三','四','五','六'][new Date(dateStr).getDay()];
        return `
          <div class="water-plan-item ${p._class}">
            <div>
              <span class="water-plan-date">${dateStr} 周${weekday}</span>
              <span style="margin-left:6px;font-size:11px;color:${p._class==='overdue'?'#c62828':p._class==='today'?'#e65100':'#999'}">${p._label}</span>
            </div>
            ${p.status === 'pending' ? `
              <div class="water-plan-actions">
                <button class="btn-wp-done" onclick="completePlan(${p.id}, ${plantId})">✓ 浇水</button>
                <button class="btn-wp-skip" onclick="skipPlan(${p.id}, ${plantId})">跳过</button>
              </div>
            ` : p.status === 'done' ? `<span style="font-size:11px;color:#999">${(p.actual_date||'').slice(5,16)}</span>` : ''}
          </div>`;
      }).join('');
    }

    body.innerHTML = html;
  } catch(e) {
    body.innerHTML = `<div style="text-align:center;color:#c62828;padding:20px">加载失败: ${e.message}</div>`;
  }
}

function triggerPhotoUpload(plantId) {

async function handlePhotoUpload(event, plantId) {
  const file = event.target.files[0];
  if (!file) return;

  // Validate file size (max 5MB)
  if (file.size > 5 * 1024 * 1024) {
    showToast('照片不能超过5MB');
    event.target.value = '';
    return;
  }

  // Show uploading state
  const photoArea = document.getElementById('plantPhotoArea');
  const originalHTML = photoArea.innerHTML;
  photoArea.innerHTML = '<div style="text-align:center;padding:20px;color:#999">上传中...</div>';

  try {
    const formData = new FormData();
    formData.append('photo', file);

    const response = await fetch(`${API}/api/user/${currentUser.id}/plants/${plantId}/photo`, {
      method: 'POST',
      body: formData
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || '上传失败');

    showToast('📷 照片上传成功');
    // Refresh modal
    const title = document.getElementById('plantModalTitle').textContent;
    const nameMatch = title.match(/🌱 (.+?) ·/);
    const plantName = nameMatch ? nameMatch[1] : '';
    const pData = await api(`/api/user/${currentUser.id}/plants`);
    const plant = (pData.plants||[]).find(p => p.id === plantId);
    if (plant) openPlantDetail(plantId, plant.flower_id, plantName);
    renderMyFlowers();
  } catch(e) {
    showToast(e.message);
    photoArea.innerHTML = originalHTML;
  }
  event.target.value = '';
}

async function identifyPlant(plantId) {
  const btn = document.getElementById('btnIdentify');
  if (btn) { btn.disabled = true; btn.textContent = '🔍 识别中...'; }

  try {
    const data = await api(`/api/user/${currentUser.id}/plants/${plantId}/identify`, {
      method: 'POST'
    });

      showToast('✓ 识别完成');

      const title = document.getElementById('plantModalTitle').textContent;
      const nameMatch = title.match(/🌱 (.+?) ·/);
      const plantName = nameMatch ? nameMatch[1] : '';
      const pData = await api(`/api/user/${currentUser.id}/plants`);
      const plant = (pData.plants||[]).find(p => p.id === plantId);

async function renderReminders() {

  if (!currentUser) return;
  try {
    const data = await api(`/api/user/${currentUser.id}/reminders`);
    const reminders = data.reminders;

    if (reminders.length === 0) {
      // Check if user has flowers

          <div class="empty-state"><div class="empty-icon">✅</div><p>暂无待办提醒，养花做得很好！</p></div>`;
      }

    const labels = { water: '浇水', fertilize: '施肥' };

function showKnowledgeDetail(key) {
  const kd = KNOWLEDGE[key];

  document.getElementById('kdTitle').textContent = kd.title;
  document.getElementById('kdBody').innerHTML = kd.content;
  document.getElementById('knowledgeDetailPage').classList.add('show');
}

function closeKnowledgeDetail() {
  document.getElementById('knowledgeDetailPage').classList.remove('show');
}

// ==================== MY PROFILE ====================
async function showMyProfile() {
  if (!currentUser) return;
  try {
    const data = await api(`/api/user/${currentUser.id}/profile`);
    const user = data.user;
    const stats = data.stats;
    const season = getCurrentSeason();

    document.getElementById('profileContent').innerHTML = `
      <div class="profile-avatar">${user.username.charAt(0).toUpperCase()}</div>
      <div class="profile-username">${user.username}</div>
      <div class="profile-city">📍 ${user.city || '未设置城市'} · ${getSeasonEmoji(season)} ${getSeasonName(season)}</div>
      <div class="profile-section">
        <div class="profile-section-title">账户信息</div>
        <div class="profile-item" onclick="openEditCity()">
          <span class="pi-icon">📍</span><span class="pi-label">所在城市</span>
          <span class="pi-value">${user.city || '未设置'}</span><span class="pi-arrow">▸</span>
        </div>
        <div class="profile-item" onclick="openEditPassword()">
          <span class="pi-icon">🔐</span><span class="pi-label">修改密码</span>
          <span class="pi-value">••••••</span><span class="pi-arrow">▸</span>
        </div>
      </div>
      <div class="profile-section">
        <div class="profile-section-title">养花数据</div>
        <div class="profile-item" style="cursor:default">
          <span class="pi-icon">🌺</span><span class="pi-label">我的花卉</span>
          <span class="pi-value">${stats.flowers} 种</span>
        </div>
        <div class="profile-item" style="cursor:default">
          <span class="pi-icon">💧</span><span class="pi-label">浇水记录</span>
          <span class="pi-value">${stats.water} 次</span>
        </div>
        <div class="profile-item" style="cursor:default">
          <span class="pi-icon">🧪</span><span class="pi-label">施肥记录</span>
          <span class="pi-value">${stats.fertilize} 次</span>
        </div>
      </div>
      <div class="profile-section">
        <div class="profile-section-title">其他</div>
        <div class="profile-item" onclick="handleLogout(); closeMyProfile();">
          <span class="pi-icon">🚪</span><span class="pi-label" style="color:var(--danger)">退出登录</span>
          <span class="pi-arrow">▸</span>
        </div>

  } catch (e) {

function closeMyProfile() {
  document.getElementById('profilePage').classList.remove('show');
}

function openEditCity() {
  const city = currentUser.city || '';
  document.getElementById('pemTitle').textContent = '修改城市';
  document.getElementById('pemBody').innerHTML = `
    <div class="pem-success" id="pemSuccess">城市修改成功</div>
    <div class="form-group"><label>所在城市</label><input type="text" id="editCityInput" value="${city}" placeholder="如：南京、北京"></div>
    <p style="font-size:12px;color:var(--text-light);margin-bottom:16px">设置城市后，系统会根据当地气候自动调整浇水周期提示</p>
    <button class="auth-submit" onclick="saveCity()">保存</button>`;
  document.getElementById('profileEditModal').classList.add('show');
}

async function saveCity() {
  const city = document.getElementById('editCityInput').value.trim();
  try {
    await api(`/api/user/${currentUser.id}/profile`, { method: 'PUT', body: { city } });
    currentUser.city = city;
    locationData.city = city || '未知';
    updateLocationBar();
    localStorage.setItem('flower_user', JSON.stringify(currentUser));
    document.getElementById('pemSuccess').style.display = 'block';
    setTimeout(() => { closeProfileEdit(); showMyProfile(); }, 800);
  } catch (e) {
    showToast('保存失败');
  }
}

function openEditPassword() {
  document.getElementById('pemTitle').textContent = '修改密码';
  document.getElementById('pemBody').innerHTML = `
    <div class="pem-success" id="pemSuccess">密码修改成功</div>
    <div class="form-group"><label>当前密码</label><input type="password" id="editOldPass" placeholder="请输入当前密码"></div>
    <div class="form-group"><label>新密码</label><input type="password" id="editNewPass" placeholder="请输入新密码（至少6位）"></div>
    <div class="form-group"><label>确认新密码</label><input type="password" id="editNewPass2" placeholder="请再次输入新密码"></div>
    <div class="auth-error" id="pemError"></div>
    <button class="auth-submit" onclick="savePassword()">保存</button>`;
  document.getElementById('profileEditModal').classList.add('show');
}

async function savePassword() {
  const oldPass = document.getElementById('editOldPass').value;
  const newPass = document.getElementById('editNewPass').value;
  const newPass2 = document.getElementById('editNewPass2').value;
  if (!oldPass) { showAuthError('pemError', '请输入当前密码'); return; }
  if (!newPass || newPass.length < 6) { showAuthError('pemError', '新密码至少6位'); return; }
  if (newPass !== newPass2) { showAuthError('pemError', '两次密码不一致'); return; }
  try {
    await api(`/api/user/${currentUser.id}/password`, { method: 'PUT', body: { old_password: oldPass, new_password: newPass } });
    document.getElementById('pemSuccess').style.display = 'block';
    setTimeout(() => { closeProfileEdit(); showMyProfile(); }, 800);
  } catch (e) {
    showAuthError('pemError', e.message);
  }
}

function closeProfileEdit() {
  document.getElementById('profileEditModal').classList.remove('show');
}

// ==================== PHOTO LIGHTBOX ====================
let lightboxFlower = null;
let lightboxIndex = 0;

function openLightbox(flowerId, index) {
  const f = allFlowers.find(fl => fl.flower_id === flowerId);
  if (!f || !f.photos || f.photos.length === 0) return;
  lightboxFlower = f;
  lightboxIndex = index;
  updateLightbox();
  document.getElementById('lightbox').classList.add('show');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
}

function lightboxNav(dir) {
  if (!lightboxFlower || !lightboxFlower.photos) return;
  lightboxIndex = (lightboxIndex + dir + lightboxFlower.photos.length) % lightboxFlower.photos.length;
  updateLightbox();
}

function updateLightbox() {
  if (!lightboxFlower || !lightboxFlower.photos) return;
  const img = document.getElementById('lightboxImg');
  img.src = lightboxFlower.photos[lightboxIndex].replace('w=600&h=400', 'w=800&h=600');
  const label = (lightboxFlower.photo_labels || [])[lightboxIndex] || '';
  document.getElementById('lightboxCounter').textContent =
    (lightboxIndex + 1) + ' / ' + lightboxFlower.photos.length + (label ? ' · ' + label : '');
}

// ==================== UTILITY ====================
function updateBadge() {
  const count = _myFlowerIds.length;
  const badge = document.getElementById('myBadge');
  if (count > 0) { badge.textContent = count; badge.style.display = ''; }
  else { badge.style.display = 'none'; }
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// ==================== SEARCH (fuzzy query via API) ====================
let searchTimer = null;
document.addEventListener('DOMContentLoaded', function() {
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('input', function() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(async () => {
        const q = this.value.trim();
        if (q) {
          try {
            const data = await api('/api/flowers?search=' + encodeURIComponent(q));
            allFlowers = data.flowers;
          } catch (e) { /* keep existing */ }
        } else {
          try {
            const data = await api('/api/flowers');
            allFlowers = data.flowers;
          } catch (e) { /* keep existing */ }
        }
        renderFlowerGrid();
      }, 300);
    });
  }
});

// ==================== INIT ====================
(async function init() {
  const saved = localStorage.getItem('flower_user');
  if (saved) {
    try {
      const user = JSON.parse(saved);
      // Verify user still exists by calling profile API
      const data = await api(`/api/user/${user.id}/profile`);
      currentUser = data.user;
      enterApp();
      return;
    } catch (e) {
      localStorage.removeItem('flower_user');
    }
  }
  document.getElementById('authPage').classList.add('show');
  document.getElementById('mainApp').style.display = 'none';
})();
</script>
