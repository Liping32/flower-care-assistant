<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>花卉养殖助手</title>
<style>
:root {
  --primary: #2e7d32;
  --primary-light: #4caf50;
  --primary-dark: #1b5e20;
  --accent: #66bb6a;
  --bg: #f1f8e9;
  --card: #ffffff;
  --text: #2e3b2e;
  --text-light: #6b7c6b;
  --border: #c8e6c9;
  --danger: #e53935;
  --warning: #f9a825;
  --info: #1976d2;
  --radius: 12px;
  --shadow: 0 2px 12px rgba(46,125,50,0.12);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
  overflow-x: hidden;
}

/* Header */
.header {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header h1 { font-size: 20px; font-weight: 600; display:flex; align-items:center; gap:8px; }
.header-btns { display:flex; gap:8px; }
.header-btn {
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.2s;
}
.header-btn:hover { background: rgba(255,255,255,0.35); }

/* Location Bar */
.location-bar {
  background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
  padding: 8px 20px;
  font-size: 13px;
  color: var(--primary-dark);
  display: flex;
  align-items: center;
  gap: 6px;
  border-bottom: 1px solid var(--border);
}
.location-bar .season-tag {
  background: var(--primary);
  color: white;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  margin-left: auto;
}

/* Tab Navigation */
.tab-nav {
  display: flex;
  background: var(--card);
  border-bottom: 2px solid var(--border);
  position: sticky;
  top: 56px;
  z-index: 99;
}
.tab-btn {
  flex: 1;
  padding: 12px 8px;
  text-align: center;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-light);
  border: none;
  background: none;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.tab-btn.active {
  color: var(--primary);
  font-weight: 600;
}
.tab-btn.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 20%;
  right: 20%;
  height: 3px;
  background: var(--primary);
  border-radius: 3px 3px 0 0;
}
.tab-btn .badge {
  background: var(--danger);
  color: white;
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 8px;
  margin-left: 4px;
  vertical-align: top;
}

/* Tab Content */
.tab-content { display: none; padding: 16px; padding-bottom: 80px; }
.tab-content.active { display: block; }

/* Season Filter */
.season-filter {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.season-btn {
  padding: 6px 16px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--card);
  color: var(--text-light);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.season-btn.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

/* Flower Card */
.flower-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.flower-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
  position: relative;
}
.flower-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(46,125,50,0.2); }
.flower-card.dragging { opacity: 0.4; transform: scale(0.95); }
.flower-card.drag-over { border: 2px dashed var(--primary-light); transform: translateY(-2px); }
.flower-card .drag-handle {
  position: absolute; top: 4px; right: 4px; width: 24px; height: 24px;
  background: rgba(255,255,255,0.85); border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 14px; cursor: grab;
  box-shadow: 0 1px 4px rgba(0,0,0,0.15); z-index: 2; color: var(--text-light);
  transition: background 0.2s;
}
.flower-card .drag-handle:active { cursor: grabbing; background: var(--border); }
.flower-card .flower-img {
  width: 100%;
  height: 130px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.flower-card .flower-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s;
}
.flower-card:hover .flower-img img { transform: scale(1.05); }
.flower-card .flower-img .emoji-fallback {
  font-size: 56px;
  position: absolute;
}
.flower-card .flower-info { padding: 10px 12px; }
.flower-card .flower-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.flower-card .flower-desc { font-size: 12px; color: var(--text-light); line-height: 1.5; }
.flower-card .add-btn {
  margin: 0 12px 10px;
  padding: 5px 0;
  width: calc(100% - 24px);
  background: var(--primary-light);
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  transition: background 0.2s;
}
.flower-card .add-btn:hover { background: var(--primary); }
.flower-card .add-btn.added { background: #bdbdbd; cursor: default; }

/* Knowledge Section */
.knowledge-section {
  margin-top: 20px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.knowledge-header {
  padding: 12px 16px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  font-weight: 600;
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.knowledge-item {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.15s;
}
.knowledge-item:hover { background: #f1f8e9; }
.knowledge-item:last-child { border-bottom: none; }
.knowledge-item .ki-title {
  font-size: 14px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.knowledge-item .ki-desc { font-size: 12px; color: var(--text-light); }
.knowledge-item .ki-arrow { margin-left: auto; color: var(--text-light); font-size: 12px; }

/* Modal / Detail */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal-content {
  background: var(--card);
  border-radius: 16px 16px 0 0;
  width: 100%;
  max-width: 480px;
  max-height: 85vh;
  overflow-y: auto;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-header {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--card);
  z-index: 1;
}
.modal-header h2 { font-size: 17px; }
.modal-close {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: none;
  background: #f5f5f5;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-body { padding: 16px 20px 24px; }

/* Detail sections */
.detail-section {
  margin-bottom: 16px;
  padding: 12px;
  background: #f9fbe7;
  border-radius: 8px;
  border-left: 3px solid var(--primary-light);
}
.detail-section h3 {
  font-size: 14px;
  color: var(--primary-dark);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.detail-section p, .detail-section li {
  font-size: 13px;
  line-height: 1.7;
  color: var(--text);
}
.detail-section ul { padding-left: 18px; }

/* Season tabs inside detail */
.detail-season-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}
.detail-season-tab {
  padding: 4px 12px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: white;
  font-size: 12px;
  cursor: pointer;
}
.detail-season-tab.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

/* My Flower List */
.my-flower-item {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 12px;
  overflow: hidden;
}
.my-flower-header {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  gap: 12px;
  cursor: pointer;
}
.my-flower-emoji { font-size: 36px; width:48px; height:48px; border-radius:8px; overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.my-flower-emoji img { width:100%; height:100%; object-fit:cover; }
.my-flower-meta { flex: 1; }
.my-flower-name { font-size: 15px; font-weight: 600; }
.my-flower-status { font-size: 12px; color: var(--text-light); margin-top: 2px; }
.my-flower-status-sub { font-size: 11px; color: var(--text-light); margin-top: 1px; opacity: 0.8; }
.climate-banner { background: linear-gradient(135deg, #e8f5e9, #c8e6c9); border-radius: 10px; padding: 8px 14px; font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; line-height: 1.5; }
.climate-adjusted { font-size: 10px; margin-left: 2px; cursor: help; opacity: 0.7; }
.my-flower-actions { display: flex; gap: 6px; }
.my-flower-actions button {
  padding: 4px 10px;
  border-radius: 14px;
  border: none;
  font-size: 11px;
  cursor: pointer;
  transition: opacity 0.2s;
}
.my-flower-actions button:hover { opacity: 0.8; }
.btn-water { background: #e3f2fd; color: #1565c0; }
.btn-fertilize { background: #fff3e0; color: #e65100; }
.btn-remove { background: #ffebee; color: #c62828; }

/* Reminder Cards */
.reminder-card {
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
}
.reminder-card.overdue { background: #fff3e0; }
.reminder-card.today { background: #e8f5e9; }
.reminder-card.soon { background: #e3f2fd; }
.reminder-icon { font-size: 18px; }
.reminder-text { flex: 1; }
.reminder-text .rt-label { font-weight: 500; }
.reminder-text .rt-days { font-size: 11px; color: var(--text-light); }
.reminder-actions { display: flex; gap: 4px; flex-shrink: 0; }
.reminder-action {
  padding: 4px 10px;
  border-radius: 14px;
  border: none;
  font-size: 11px;
  cursor: pointer;
  background: var(--primary-light);
  color: white;
}
.reminder-btn-confirm {
  padding: 3px 8px;
  border-radius: 12px;
  border: 1px solid #4caf50;
  font-size: 11px;
  cursor: pointer;
  background: #e8f5e9;
  color: #2e7d32;
}
.reminder-btn-keep {
  padding: 3px 8px;
  border-radius: 12px;
  border: 1px solid #ff9800;
  font-size: 11px;
  cursor: pointer;
  background: #fff3e0;
  color: #e65100;
}

/* Auth Page */
.auth-page {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg);
  z-index: 300;
  max-width: 480px;
  margin: 0 auto;
}
.auth-page.show { display: flex; flex-direction: column; }
.auth-header {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white;
  padding: 40px 24px 30px;
  text-align: center;
}
.auth-header h1 { font-size: 26px; margin-bottom: 8px; display:flex; align-items:center; justify-content:center; gap:10px; }
.auth-header p { font-size: 14px; opacity: 0.9; }
.auth-form {
  flex: 1;
  padding: 30px 24px;
}
.auth-form h2 { font-size: 20px; margin-bottom: 20px; color: var(--primary-dark); }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-light); }
.form-group input {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 15px;
  transition: border-color 0.2s;
  background: white;
}
.form-group input:focus { outline: none; border-color: var(--primary); }
.auth-submit {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
  transition: opacity 0.2s;
}
.auth-submit:hover { opacity: 0.9; }
.auth-switch {
  text-align: center;
  margin-top: 16px;
  font-size: 13px;
  color: var(--text-light);
}
.auth-switch a { color: var(--primary); cursor: pointer; text-decoration: none; }
.auth-error {
  background: #ffebee;
  color: #c62828;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 13px;
  margin-bottom: 12px;
  display: none;
}

/* Empty State */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-light);
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; margin-bottom: 16px; }
.empty-state button {
  padding: 10px 24px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 20px;
  font-size: 14px;
  cursor: pointer;
}

/* Search Bar */
.search-bar {
  display: flex;
  align-items: center;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 8px 14px;
  margin-bottom: 14px;
  gap: 8px;
}
.search-bar input {
  flex: 1;
  border: none;
  outline: none;
  font-size: 14px;
  background: none;
}
.search-bar .search-icon { color: var(--text-light); }

/* Notification toast */
.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--primary-dark);
  color: white;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 500;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* Knowledge detail page */
.knowledge-detail-page {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg);
  z-index: 250;
  max-width: 480px;
  margin: 0 auto;
  overflow-y: auto;
}
.knowledge-detail-page.show { display: block; }
.kd-header {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 1;
}
.kd-header button {
  background: none;
  border: none;
  color: white;
  font-size: 18px;
  cursor: pointer;
}
.kd-header h2 { font-size: 17px; }
.kd-body { padding: 16px 20px 80px; }

/* Care schedule display */
.schedule-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin: 12px 0;
}
.schedule-item {
  text-align: center;
  padding: 8px 4px;
  border-radius: 8px;
  background: white;
  border: 1px solid var(--border);
}
.schedule-item .si-icon { font-size: 20px; }
.schedule-item .si-label { font-size: 10px; color: var(--text-light); margin-top: 2px; }
.schedule-item .si-value { font-size: 13px; font-weight: 600; color: var(--primary); }

/* Responsive */
@media (min-width: 481px) {
  body { box-shadow: 0 0 20px rgba(0,0,0,0.1); }
}

/* Profile Page */
.profile-page {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg);
  z-index: 250;
  max-width: 480px;
  margin: 0 auto;
  overflow-y: auto;
}
.profile-page.show { display: block; }
.profile-header {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 1;
}
.profile-header button {
  background: none;
  border: none;
  color: white;
  font-size: 18px;
  cursor: pointer;
}
.profile-header h2 { font-size: 17px; }
.profile-avatar {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: linear-gradient(135deg, #81c784, #388e3c);
  color: white;
  font-size: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 24px auto 12px;
  box-shadow: 0 4px 12px rgba(46,125,50,0.3);
  position: relative;
  cursor: pointer;
  overflow: hidden;
  transition: box-shadow 0.2s;
}
.profile-avatar:active {
  box-shadow: 0 2px 6px rgba(46,125,50,0.3);
}
.profile-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}
.profile-avatar .avatar-camera {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(0,0,0,0.4);
  color: white;
  font-size: 11px;
  text-align: center;
  padding: 2px 0;
  opacity: 0;
  transition: opacity 0.2s;
}
.profile-avatar:hover .avatar-camera,
.profile-avatar:active .avatar-camera {
  opacity: 1;
}
.profile-username {
  text-align: center;
  font-size: 18px;
  font-weight: 600;
  color: var(--primary-dark);
  margin-bottom: 4px;
}
.profile-city {
  text-align: center;
  font-size: 13px;
  color: var(--text-light);
  margin-bottom: 24px;
}
.profile-section {
  background: var(--card);
  margin: 0 16px 8px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.profile-section-title {
  padding: 8px 16px 4px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-light);
}
.profile-item {
  padding: 9px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.15s;
}
.profile-item:hover { background: #f1f8e9; }
.profile-item:last-child { border-bottom: none; }
.profile-item .pi-icon { font-size: 20px; width: 28px; text-align: center; }
.profile-item .pi-label { flex: 1; font-size: 14px; }
.profile-item .pi-value { font-size: 13px; color: var(--text-light); }
.profile-item .pi-arrow { color: var(--text-light); font-size: 12px; }

/* Profile Edit Modal */
.profile-edit-modal {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg);
  z-index: 260;
  max-width: 480px;
  margin: 0 auto;
  overflow-y: auto;
}
.profile-edit-modal.show { display: block; }
.pem-header {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 1;
}
.pem-header button {
  background: none;
  border: none;
  color: white;
  font-size: 18px;
  cursor: pointer;
}
.pem-header h2 { font-size: 17px; }
.pem-body { padding: 24px 20px; }
.pem-body .form-group { margin-bottom: 18px; }
.pem-body .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: var(--text); }
.pem-body .form-group input {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 15px;
  transition: border-color 0.2s;
  background: white;
}
.pem-body .form-group input:focus { outline: none; border-color: var(--primary); }
.pem-body .auth-submit { margin-top: 16px; }
.pem-success {
  background: #e8f5e9;
  color: var(--primary-dark);
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 13px;
  margin-bottom: 12px;
  display: none;
  text-align: center;
}

/* Flower Config */
.fc-list { list-style: none; padding: 0; margin: 0; }
.fc-item {
  display: flex;
  align-items: center;
  gap: 10px;

<script>
// ==================== API LAYER ====================
const API = window.location.protocol === 'file:' ? 'http://localhost:8765' : '';

let _serverDown = false;

async function api(path, options = {}) {
  let resp;
  try {
    resp = await fetch(API + path, {
      headers: { 'Content-Type': 'application/json' },
      ...options,
      body: options.body ? JSON.stringify(options.body) : undefined
    });
  } catch (e) {
    _serverDown = true;
    showServerDownBanner();
    throw new Error('无法连接服务器');
  }
  let data;
  try {
    data = await resp.json();
  } catch (e) {
    throw new Error('服务器响应异常(非JSON)');
  }
  if (!resp.ok) throw new Error(data.error || '请求失败');
  return data;
}

function showServerDownBanner() {
  if (document.getElementById('serverDownBanner')) return;
  const banner = document.createElement('div');
  banner.id = 'serverDownBanner';
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:10000;background:#ff4444;color:#fff;padding:12px 16px;font-size:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.3);';

// ==================== SEASON HELPERS ====================
function getCurrentSeason() {
  const month = new Date().getMonth() + 1;
  if (month >= 3 && month <= 5) return 'spring';
  if (month >= 6 && month <= 8) return 'summer';
  if (month >= 9 && month <= 11) return 'autumn';
  return 'winter';
}
function getSeasonName(s) {
  return { spring: '春季', summer: '夏季', autumn: '秋季', winter: '冬季' }[s] || s;
}
function getSeasonEmoji(s) {
  return { spring: '🌸', summer: '☀️', autumn: '🍂', winter: '❄️' }[s] || '';
}
function adjustWaterDays(baseDays, season, city) {
  // Deprecated - now using server-side climate adjustment
  // Kept as fallback for knowledge tab only
  return baseDays;
}

function initLocation() {
  if (locationData.city && locationData.city !== '未知') {
    updateLocationBar();
    return;
  }
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        locationData.lat = pos.coords.latitude;
        locationData.lng = pos.coords.longitude;
        fetch(`https://nominatim.openstreetmap.org/reverse?lat=${locationData.lat}&lon=${locationData.lng}&format=json&accept-language=zh`)
          .then(r => r.json())
          .then(data => {
            if (data.address) {
              locationData.city = data.address.city || data.address.county || data.address.state || '未知';
            }
            updateLocationBar();
          })
          .catch(() => updateLocationBar());
      },
      () => updateLocationBar()
    );
  } else {
    updateLocationBar();
  }
}

function updateLocationBar() {
  document.getElementById('locationText').textContent = '📍 ' + locationData.city;
  const now = new Date();
  const weekDays = ['日', '一', '二', '三', '四', '五', '六'];

  document.getElementById('dateText').textContent = dateStr;

let _dragSrcIdx = null;

function renderFlowerGrid() {
  const grid = document.getElementById('flowerGrid');
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const season = currentSeason;

  let filtered = allFlowers;
  if (search) {
    filtered = filtered.filter(f => f.name.includes(search) || (f.desc||'').includes(search) || f.flower_id.includes(search));
  }

  const city = currentUser ? currentUser.city : (locationData.city || '');
  const curSeason = getCurrentSeason();

  grid.innerHTML = filtered.map((f, idx) => {
    const isAdded = _myFlowerIds.includes(f.flower_id);
    const sd = season !== 'all' ? (f.seasons[season]||{}) : (f.seasons[curSeason]||{});
    const waterDisplay = sd.water || '';
    return `
      <div class="flower-card" data-idx="${idx}" data-id="${f.flower_id}" draggable="true"
           onclick="showFlowerDetail('${f.flower_id}')">
        <div class="drag-handle" title="拖拽排序" onclick="event.stopPropagation()">⠿</div>
        <div class="flower-img"><img src="${f.photo}" alt="${f.name}" onerror="this.style.display='none';this.parentElement.innerHTML='<span class=emoji-fallback>${f.emoji}</span>'"></div>
        <div class="flower-info">
          <div class="flower-name">${f.name}</div>
          <div class="flower-desc">${season !== 'all' ? '💧 ' + waterDisplay + ' · 🧪 ' + (sd.fertilize||'') : (f.desc||'')}</div>
        </div>
        <button class="add-btn ${isAdded ? 'added' : ''}" onclick="event.stopPropagation(); ${isAdded ? '' : "addMyFlower('" + f.flower_id + "')"}">
          ${isAdded ? '✓ 已添加' : '+ 加入我的花卉'}
        </button>
      </div>
    `;
  }).join('');

  // Setup drag events
  setupDragAndDrop(grid, filtered);
}

function setupDragAndDrop(grid, filtered) {
  const hasSearch = document.getElementById('searchInput').value.trim().length > 0;
  const cards = grid.querySelectorAll('.flower-card');
  cards.forEach(card => {
    card.addEventListener('dragstart', function(e) {
      _dragSrcIdx = parseInt(this.dataset.idx);
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', this.dataset.id);
    });
    card.addEventListener('dragend', function() {
      this.classList.remove('dragging');
      cards.forEach(c => c.classList.remove('drag-over'));
    });
    card.addEventListener('dragover', function(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      cards.forEach(c => c.classList.remove('drag-over'));
      this.classList.add('drag-over');
    });
    card.addEventListener('dragleave', function() {
      this.classList.remove('drag-over');
    });
    card.addEventListener('drop', function(e) {
      e.preventDefault();
      this.classList.remove('drag-over');
      const targetIdx = parseInt(this.dataset.idx);
      if (_dragSrcIdx === null || _dragSrcIdx === targetIdx) return;

      // Swap positions in allFlowers
      const draggedFlower = allFlowers.find(f => f.flower_id === filtered[_dragSrcIdx].flower_id);
      if (!draggedFlower) return;
      const srcId = filtered[_dragSrcIdx].flower_id;
      const tgtId = filtered[targetIdx].flower_id;
      const realSrc = allFlowers.findIndex(f => f.flower_id === srcId);
      const realTgt = allFlowers.findIndex(f => f.flower_id === tgtId);
      if (realSrc >= 0 && realTgt >= 0) {
        allFlowers.splice(realSrc, 1);
        allFlowers.splice(realTgt > realSrc ? realTgt - 1 : realTgt, 0, draggedFlower);
      }

      // Save order
      saveFlowerOrder();
      renderFlowerGrid();
    });
  });
}

function saveFlowerOrder() {
  const order = allFlowers.map(f => f.flower_id);
  localStorage.setItem('flower_order', JSON.stringify(order));
  // Save to server via flower-config API if logged in
  if (currentUser) {
    const items = allFlowers.map((f, idx) => ({
      flower_id: f.flower_id,
      visible: f.visible !== undefined ? f.visible : 1,
      sort_order: idx
    }));
    api('/api/user/' + currentUser.id + '/flower-config', {
      method: 'PUT',
      body: { items }
    }).catch(() => {
      showToast('排序同步到服务器失败，已保存到本地');
    });
  }
}

            </div>
            <div class="my-flower-actions" onclick="event.stopPropagation()">
              <button class="btn-remove" onclick="removeMyFlower('${mf.flower_id}')">移除</button>

                 ${flowerPlants.length > 1 ? `onclick="togglePlantList('${mf.flower_id}')"` : ''}>
              <span class="plant-section-title">
                🌱 我的植株 (${flowerPlants.length})${flowerPlants.length > 1 ? '<span class="plant-collapse-arrow collapsed" id="arrow-' + mf.flower_id + '">▼</span>' : ''}

            </div>

  } catch (e) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">❌</div><p>加载失败: ${e.message}</p></div>`;

}

// ==================== MY PLANTS (植株管理) ====================
function togglePlantList(flowerId) {
  const list = document.getElementById('plantList-' + flowerId);
  const arrow = document.getElementById('arrow-' + flowerId);
  if (!list) return;
  const isHidden = list.style.display === 'none';
  list.style.display = isHidden ? '' : 'none';
  if (arrow) arrow.classList.toggle('collapsed', !isHidden);
}

async function showAddPlantDialog(flowerId, btn) {
  // 展开植株列表
  const list = document.getElementById('plantList-' + flowerId);
  const arrow = document.getElementById('arrow-' + flowerId);
  if (list && list.style.display === 'none') { list.style.display = ''; if (arrow) arrow.classList.remove('collapsed'); }
  const name = prompt('请输入植株名称:');
  if (!name || !name.trim()) return;
  try {
    await api(`/api/user/${currentUser.id}/plants`, {
      method: 'POST',
      body: { flower_id: flowerId, plant_name: name.trim() }
    });
    showToast(`🌱 植株「${name.trim()}」已添加，养护计划已自动生成`);
    renderMyFlowers();
  } catch(e) {
    showToast(e.message);
  }
}

function closePlantModal() {
  document.getElementById('plantModal').style.display = 'none';
}

async function completePlan(planId, plantId, careType) {
  try {
    await api(`/api/user/${currentUser.id}/water-plans/${planId}/complete`, { method: 'POST' });
    const labels = { water: '💧 浇水', fertilize: '🧪 施肥', repot: '🔄 换盆' };
    showToast(`${labels[careType] || '操作'}完成！`);
    // Refresh modal
    const title = document.getElementById('plantModalTitle').textContent;
    const nameMatch = title.match(/🌱 (.+?) ·/);
    const plantName = nameMatch ? nameMatch[1] : '';
    const pData = await api(`/api/user/${currentUser.id}/plants`);
    const plant = (pData.plants||[]).find(p => p.id === plantId);
    if (plant) openPlantDetail(plantId, plant.flower_id, plantName);
    renderMyFlowers();
    renderReminders();
  } catch(e) { showToast(e.message); }
}

async function skipPlan(planId, plantId, careType) {
  try {
    await api(`/api/user/${currentUser.id}/water-plans/${planId}/skip`, { method: 'POST' });
    const labels = { water: '浇水', fertilize: '施肥', repot: '换盆' };

async function handlePhotoUpload(event, plantId) {
  const file = event.target.files[0];
  if (!file) return;

  // Validate file size (max 5MB)
  if (file.size > 5 * 1024 * 1024) {
    showToast('照片不能超过5MB');
    event.target.value = '';
    return;
  }

  // Show uploading state
  const photoArea = document.getElementById('plantPhotoArea');
  const originalHTML = photoArea.innerHTML;
  photoArea.innerHTML = '<div style="text-align:center;padding:20px;color:#999">上传中...</div>';

  try {
    const formData = new FormData();
    formData.append('photo', file);

    const response = await fetch(`${API}/api/user/${currentUser.id}/plants/${plantId}/photo`, {
      method: 'POST',
      body: formData
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || '上传失败');

    showToast('📷 照片上传成功');
    // Refresh modal
    const title = document.getElementById('plantModalTitle').textContent;
    const nameMatch = title.match(/🌱 (.+?) ·/);
    const plantName = nameMatch ? nameMatch[1] : '';
    const pData = await api(`/api/user/${currentUser.id}/plants`);
    const plant = (pData.plants||[]).find(p => p.id === plantId);
    if (plant) openPlantDetail(plantId, plant.flower_id, plantName);
    renderMyFlowers();
  } catch(e) {
    showToast(e.message);
    photoArea.innerHTML = originalHTML;
  }
  event.target.value = '';
}

async function handleIdentifyPhoto(input) {
  if (!currentUser || !input.files || !input.files[0]) return;
  const file = input.files[0];

  // Show preview
  const preview = document.getElementById('identifyPreview');
  const previewImg = document.getElementById('identifyPreviewImg');
  const resultArea = document.getElementById('identifyResultArea');
  resultArea.innerHTML = '<div style="text-align:center;padding:20px;color:#999">🔍 识别中...</div>';

  const reader = new FileReader();
  reader.onload = (e) => { previewImg.src = e.target.result; preview.style.display = ''; };
  reader.readAsDataURL(file);

  // Upload and identify
  try {
    const formData = new FormData();
    formData.append('photo', file);
    const resp = await fetch(`/api/user/${currentUser.id}/identify-photo`, {
      method: 'POST',
      body: formData
    });
    const data = await resp.json();
    if (data.error) { resultArea.innerHTML = `<div style="color:red;padding:10px">${data.error}</div>`; return; }
    if (data.result) {
      renderIdentifyPageResult(data.result);
    }
  } catch(e) {
    resultArea.innerHTML = `<div style="color:red;padding:10px">识别失败: ${e.message}</div>`;
  }
  // Reset file input so same file can be re-selected
  input.value = '';
}

async function updateReminderBadge() {

    const count = data.count || data.reminders.length;

  } catch (e) { /* ignore */ }

async function renderReminders() {
  const container = document.getElementById('reminderList');
  if (!currentUser) return;
  try {
    const data = await api(`/api/user/${currentUser.id}/reminders`);
    const reminders = data.reminders;

    // Update reminder badge on tab
    const reminderBadge = document.getElementById('reminderBadge');
    if (reminders.length > 0) { reminderBadge.textContent = reminders.length; reminderBadge.style.display = ''; }
    else { reminderBadge.style.display = 'none'; }

    if (reminders.length === 0) {
      // Check if user has plants
      const plantData = await api(`/api/user/${currentUser.id}/plants`);
      if (plantData.plants.length === 0) {
        container.innerHTML = `
          <div class="empty-state"><div class="empty-icon">⏰</div><p>添加植株后即可查看养护提醒</p>
          <button onclick="switchTab('plants')">去添加植株</button></div>`;
      } else {
        container.innerHTML = `
          <div class="empty-state"><div class="empty-icon">✅</div><p>暂无待办提醒，养花做得很好！</p></div>`;
      }
      return;
    }

    const icons = { water: '💧', fertilize: '🧪', repot: '🔄' };
    const labels = { water: '浇水', fertilize: '施肥', repot: '换盆' };

    container.innerHTML = reminders.map(r => {
      const photoHtml = '';
      const keptBadge = r.reminder_status === 'kept' ? '<span style="font-size:10px;background:#fff3e0;color:#e65100;padding:1px 5px;border-radius:8px;margin-left:4px;">保持</span>' : '';

      // All reminders are now plant-level with plan_id
      const actionLabel = labels[r.type] || r.type;
      const actionEmoji = icons[r.type] || '';

      if (r.plan_id) {
        const goLabel = '去' + actionLabel;
        return `
        <div class="my-flower-item" style="margin-bottom:8px">
          <div class="reminder-card ${r.status}">
            ${photoHtml}
            <span class="reminder-icon">${actionEmoji}</span>
            <div class="reminder-text">
              <span class="rt-label">${r.emoji||''} ${r.name} · ${actionLabel}${keptBadge}</span><br>
              <span class="rt-days">${r.msg}</span>
            </div>
            <div class="reminder-actions">
              <button class="reminder-btn-confirm" onclick="confirmReminder(${r.plan_id})">确认</button>
              <button class="reminder-btn-keep" onclick="keepReminder(${r.plan_id})">保持</button>
              <button class="reminder-action" onclick="goAndDoCare(${r.plan_id}, ${r.plant_id}, '${r.flower_id}', '${r.name.replace(/'/g, "\\'")}', '${r.type}')">${goLabel}</button>
            </div>
          </div>
        </div>`;
      }

      // Fallback: flower-level reminder without plan_id (legacy)
      return `
      <div class="my-flower-item" style="margin-bottom:8px">
        <div class="reminder-card ${r.status}">
          <span class="reminder-icon">${actionEmoji}</span>
          <div class="reminder-text">
            <span class="rt-label">${r.emoji||''} ${r.name} · ${actionLabel}</span><br>
            <span class="rt-days">${r.msg}${r.days !== null ? '（上次' + r.days + '天前）' : ''}</span>
          </div>
          <button class="reminder-action" onclick="recordAction('${r.flower_id}','${r.type}')">${actionLabel}</button>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">❌</div><p>加载失败: ${e.message}</p></div>`;
  }
}

async function goAndDoCare(planId, plantId, flowerId, plantName, careType) {
  // 先确认掉该提醒
  try {
    await api(`/api/user/${currentUser.id}/water-plans/${planId}/confirm`, { method: 'POST' });
  } catch (e) { /* ignore */ }
  // 切换到我的花卉tab并打开植株详情
  switchTab('myflowers');
  // 等待我的花卉渲染完成
  setTimeout(() => {
    openPlantDetail(plantId, flowerId, plantName);
  }, 300);

async function showCareLogsDetail(action) {
  if (!currentUser) return;
  const labels = { water: '浇水', fertilize: '施肥' };
  const emojis = { water: '💧', fertilize: '🧪' };
  const label = labels[action] || action;
  const emoji = emojis[action] || '';

  document.getElementById('pemTitle').textContent = `${emoji}${label}记录详情`;
  document.getElementById('pemBody').innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-light)">加载中...</div>';
  document.getElementById('profileEditModal').classList.add('show');

  try {
    const data = await api(`/api/user/${currentUser.id}/care-logs?action=${action}`);
    const logs = data.logs || [];
    if (logs.length === 0) {
      document.getElementById('pemBody').innerHTML = `<div style="text-align:center;padding:20px;color:var(--text-light)">暂无${label}记录</div>`;
      return;
    }
    let html = '<div style="max-height:60vh;overflow-y:auto">';
    for (const log of logs) {
      const d = log.date || '';
      const dateStr = d.substring(0, 10);
      const flowerDisplay = log.plant_name || log.flower_name || '未知';
      const flowerEmoji = log.flower_emoji || '🌸';
      const dateObj = new Date(dateStr);
      const weekDay = ['日','一','二','三','四','五','六'][dateObj.getDay()];
      const daysAgo = Math.floor((Date.now() - dateObj.getTime()) / 86400000);
      const daysText = daysAgo === 0 ? '今天' : daysAgo === 1 ? '昨天' : `${daysAgo}天前`;
      html += `<div style="display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">`
        + `<span style="font-size:18px;margin-right:8px">${flowerEmoji}</span>`
        + `<div style="flex:1">`
        + `<div style="font-size:14px;font-weight:500">${flowerDisplay}</div>`
        + `<div style="font-size:12px;color:var(--text-light)">${dateStr} 周${weekDay} · ${daysText}</div>`
        + `</div></div>`;
    }
    html += '</div>';
    document.getElementById('pemBody').innerHTML = html;
  } catch (e) {
    document.getElementById('pemBody').innerHTML = `<div style="text-align:center;padding:20px;color:var(--danger)">加载失败</div>`;
  }
}

async function savePassword() {
  const oldPass = document.getElementById('editOldPass').value;
  const newPass = document.getElementById('editNewPass').value;
  const newPass2 = document.getElementById('editNewPass2').value;
  if (!oldPass) { showAuthError('pemError', '请输入当前密码'); return; }
  if (!newPass || newPass.length < 6) { showAuthError('pemError', '新密码至少6位'); return; }
  if (newPass !== newPass2) { showAuthError('pemError', '两次密码不一致'); return; }
  try {
    await api(`/api/user/${currentUser.id}/password`, { method: 'PUT', body: { old_password: oldPass, new_password: newPass } });
    document.getElementById('pemSuccess').style.display = 'block';
    setTimeout(() => { closeProfileEdit(); showMyProfile(); }, 800);
  } catch (e) {
    showAuthError('pemError', e.message);
  }
}

async function handleAvatarFile(input) {
  if (!input.files || !input.files[0]) return;
  const file = input.files[0];

  // Validate size (max 5MB)
  if (file.size > 5 * 1024 * 1024) {
    showToast('图片不能超过5MB');
    return;
  }

  // Show preview
  const reader = new FileReader();
  reader.onload = function(e) {
    const preview = document.getElementById('avatarPreview');
    if (preview) {
      preview.innerHTML = `<img src="${e.target.result}" alt="预览">`;
    }
  };
  reader.readAsDataURL(file);

  // Upload
  try {
    const formData = new FormData();
    formData.append('photo', file);

    const response = await fetch(`${API}/api/user/${currentUser.id}/avatar`, {
      method: 'POST',
      body: formData
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || '上传失败');

    currentUser.avatar = data.avatar;
    localStorage.setItem('flower_user', JSON.stringify(currentUser));
    showToast('头像更新成功');
    closeProfileEdit();
    // Refresh profile page to show new avatar
    setTimeout(() => showMyProfile(), 300);
  } catch(e) {
    showToast(e.message || '头像上传失败');
  }
  // Reset input so same file can be selected again
  input.value = '';
}

async function openFlowerConfig() {

function renderFlowerConfigList() {
  const body = document.getElementById('pemBody');
  const listHtml = _fcItems.map((item, idx) => {
    const photoHtml = item.photo
      ? `<img class="fc-photo" src="/images/${item.photo}" onerror="this.outerHTML='<div class=fc-emoji>${item.emoji||"🌿"}</div>'">`
      : `<div class="fc-emoji">${item.emoji || '🌿'}</div>`;
    return `
      <li class="fc-item" data-idx="${idx}" draggable="true">
        <span class="fc-grip" title="拖拽排序">⠿</span>
        ${photoHtml}
        <span class="fc-name">${item.emoji || ''} ${item.name}</span>
        <label class="toggle-switch">
          <input type="checkbox" ${item.visible ? 'checked' : ''} data-fid="${item.flower_id}" onchange="fcToggleVisible(this)">
          <span class="toggle-slider"></span>
        </label>
      </li>`;
  }).join('');

  body.innerHTML = `
    <p style="font-size:12px;color:var(--text-light);margin-bottom:12px">拖拽调整花卉显示顺序，开关控制是否在知识页面显示</p>
    <ul class="fc-list" id="fcList">${listHtml}</ul>
    <div class="fc-save-bar">
      <button class="fc-btn-cancel" onclick="closeProfileEdit()">取消</button>
      <button class="fc-btn-sort" onclick="fcSortByVisible()">排序</button>
      <button class="fc-btn-save" onclick="saveFlowerConfig()">保存</button>
    </div>`;
  setupFcDragAndDrop();
}

function fcToggleVisible(cb) {
  const fid = cb.dataset.fid;
  const item = _fcItems.find(i => i.flower_id === fid);
  if (item) item.visible = cb.checked ? 1 : 0;
}

function fcSortByVisible() {
  const visibleItems = _fcItems.filter(i => i.visible);
  const hiddenItems = _fcItems.filter(i => !i.visible);
  _fcItems = [...visibleItems, ...hiddenItems];
  renderFlowerConfigList();
}

function setupFcDragAndDrop() {
  const list = document.getElementById('fcList');
  if (!list) return;
  const items = list.querySelectorAll('.fc-item');
  items.forEach(item => {
    item.addEventListener('dragstart', function(e) {
      _fcDragSrcIdx = parseInt(this.dataset.idx);
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    item.addEventListener('dragend', function() {
      this.classList.remove('dragging');
      items.forEach(i => i.classList.remove('drag-over'));
    });
    item.addEventListener('dragover', function(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      items.forEach(i => i.classList.remove('drag-over'));
      this.classList.add('drag-over');
    });
    item.addEventListener('dragleave', function() {
      this.classList.remove('drag-over');
    });
    item.addEventListener('drop', function(e) {
      e.preventDefault();
      this.classList.remove('drag-over');
      const targetIdx = parseInt(this.dataset.idx);
      if (_fcDragSrcIdx === null || _fcDragSrcIdx === targetIdx) return;
      // Reorder _fcItems
      const moved = _fcItems.splice(_fcDragSrcIdx, 1)[0];
      _fcItems.splice(targetIdx, 0, moved);
      renderFlowerConfigList();
    });
  });
}

async function saveFlowerConfig() {
  if (!currentUser) return;
  const items = _fcItems.map((item, idx) => ({
    flower_id: item.flower_id,
    visible: item.visible,
    sort_order: idx
  }));
  try {
    await api('/api/user/' + currentUser.id + '/flower-config', {
      method: 'PUT',
      body: { items }
    });
    showToast('配置已保存');
    closeProfileEdit();
    // Reload flowers to apply new config
    await loadFlowers();
    renderFlowerGrid();
  } catch (e) {
    showToast('保存失败');
  }
}

function onBkPhotosChange() {
  const photos = document.getElementById('bkPhotos');
  const plants = document.getElementById('bkPlants');
  if (photos.checked) plants.checked = true;
}

async function doBackup() {
  if (!currentUser) return;
  const btn = document.getElementById('bkBtn');
  btn.disabled = true;
  btn.textContent = '备份中...';
  try {
    const result = await api('/api/user/' + currentUser.id + '/backup', {
      method: 'POST',
      body: {
        include_flowers: document.getElementById('bkFlowers').checked,
        include_plants: document.getElementById('bkPlants').checked,
        include_care_logs: document.getElementById('bkLogs').checked,
        include_photos: document.getElementById('bkPhotos').checked && document.getElementById('bkPlants').checked
      }
    });
    // 用 JSZip 打包
    const zip = new JSZip();
    zip.file('backup.json', JSON.stringify(result.backup, null, 2));
    // 添加照片
    if (result.photos) {
      for (const [path, b64] of Object.entries(result.photos)) {
        zip.file(path.charAt(0) === '/' ? path.substring(1) : path, b64, {base64: true});
      }
    }
    const blob = await zip.generateAsync({type: 'blob'});
    // 下载
    const ts = new Date().toISOString().slice(0,10).replace(/-/g,'');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'flower_care_backup_' + ts + '.zip';
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('备份成功');
    closeProfileEdit();
  } catch (e) {
    showToast('备份失败: ' + (e.message || '未知错误'));
    btn.disabled = false;
    btn.textContent = '备份';
  }
}

    // 统计照片数
    let photoCount = 0;
    zip.forEach(function(relativePath, zipEntry) {
      if (!zipEntry.dir && relativePath.startsWith('plant_photos/')) photoCount++;
    });

    const d = _restoreBackup.data || {};
    const info = document.getElementById('restoreInfo');
    info.style.display = '';
    info.innerHTML = `
      <div style="background:#f8f9fa;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12px">
        <div style="margin-bottom:4px"><strong>用户：</strong>${_restoreBackup.username || '未知'}</div>
        <div><strong>导出时间：</strong>${_restoreBackup.exported_at || '未知'}</div>
      </div>`;

    const opts = document.getElementById('restoreOptions');
    opts.style.display = '';
    const fc = (d.flowers || []).length;
    const pc = (d.plants || []).length;

        <span style="margin-left:auto;font-size:12px;color:var(--text-light)">${pc} 项</span>
      </label>` : ''}

        <input type="checkbox" class="rc-check" data-type="photos" checked style="accent-color:var(--primary);width:18px;height:18px" onchange="onRestorePhotosChange()">
        <span style="font-size:14px">📷 植株照片</span>
        <span style="margin-left:auto;font-size:12px;color:var(--text-light)">${photoCount} 张</span>
      </label>` : ''}
      <p style="font-size:11px;color:var(--danger);margin-top:8px">⚠ 恢复将覆盖当前同类数据</p>`;

    document.getElementById('restoreBar').style.display = '';

function onRestorePhotosChange() {
  const checks = document.querySelectorAll('.rc-check');
  let plantsChecked = false, photosChecked = false;
  checks.forEach(c => {
    if (c.dataset.type === 'plants') plantsChecked = c.checked;
    if (c.dataset.type === 'photos') photosChecked = c.checked;
  });
  if (photosChecked && !plantsChecked) {
    checks.forEach(c => { if (c.dataset.type === 'plants') c.checked = true; });
  }
}

async function doRestore() {
  if (!_restoreBackup) return;
  const checks = document.querySelectorAll('.rc-check');
  const opts = {};
  checks.forEach(c => { opts[c.dataset.type] = c.checked; });

  if (!confirm('确认恢复？当前同类数据将被覆盖。')) return;

  const btn = document.getElementById('restoreBtn');
  btn.disabled = true;
  btn.textContent = '恢复中...';

  try {
    // 如果选了照片，从 ZIP 中提取 base64
    let photos = {};
    if (opts.photos && _restoreBackup._zip) {
      const entries = [];
      _restoreBackup._zip.forEach(function(relativePath, zipEntry) {
        if (!zipEntry.dir && relativePath.startsWith('plant_photos/')) {
          entries.push({path: '/' + relativePath, entry: zipEntry});
        }
      });
      for (const e of entries) {
        const b64 = await e.entry.async('base64');
        photos[e.path] = b64;
      }
    }

    // 发送备份数据时排除 _zip 等 JSZip 对象（不可序列化）
    const { _zip, _photoCount, ...backupPayload } = _restoreBackup;
    const result = await api('/api/user/' + currentUser.id + '/restore', {
      method: 'POST',
      body: {
        backup_data: backupPayload,
        include_flowers: !!opts.flowers,
        include_plants: !!opts.plants,
        include_care_logs: !!opts.care_logs,
        include_photos: !!opts.photos && !!opts.plants,
        photos: photos
      }
    });

    if (result.success) {
      const r = result.restored;
      let msg = '恢复完成：';
      const parts = [];
      if (r.flowers !== undefined) parts.push('花卉' + r.flowers + '项');
      if (r.plants !== undefined) parts.push('植株' + r.plants + '项');
      if (r.care_logs !== undefined) parts.push('记录' + r.care_logs + '条');
      if (r.photos !== undefined) parts.push('照片' + r.photos + '张');
      msg += parts.join('、');
      if (result.warnings && result.warnings.length > 0) {
        msg += '\\n警告：' + result.warnings.join('；');
      }
      showToast(msg);
      closeProfileEdit();
    } else {
      showToast('恢复失败');
    }
  } catch (e) {
    showToast('恢复失败: ' + (e.message || '未知错误'));
    btn.disabled = false;
    btn.textContent = '恢复';
  }
}

// ==================== PHOTO LIGHTBOX ====================
let lightboxFlower = null;
let lightboxIndex = 0;

function openLightbox(flowerId, index) {
  const f = allFlowers.find(fl => fl.flower_id === flowerId);
  if (!f || !f.photos || f.photos.length === 0) return;
  lightboxFlower = f;
  lightboxIndex = index;
  updateLightbox();
  document.getElementById('lightbox').classList.add('show');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
}

function lightboxNav(dir) {
  if (!lightboxFlower || !lightboxFlower.photos) return;
  lightboxIndex = (lightboxIndex + dir + lightboxFlower.photos.length) % lightboxFlower.photos.length;
  updateLightbox();
}

function updateLightbox() {
  if (!lightboxFlower || !lightboxFlower.photos) return;
  const img = document.getElementById('lightboxImg');
  img.src = lightboxFlower.photos[lightboxIndex].replace('w=600&h=400', 'w=800&h=600');
  const label = (lightboxFlower.photo_labels || [])[lightboxIndex] || '';
  document.getElementById('lightboxCounter').textContent =
    (lightboxIndex + 1) + ' / ' + lightboxFlower.photos.length + (label ? ' · ' + label : '');
}

// ==================== UTILITY ====================
function updateBadge() {
  const count = _myFlowerIds.length;
  const badge = document.getElementById('myBadge');
  if (count > 0) { badge.textContent = count; badge.style.display = ''; }
  else { badge.style.display = 'none'; }
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// ==================== SEARCH (fuzzy query via API) ====================
let searchTimer = null;
document.addEventListener('DOMContentLoaded', function() {
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('input', function() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(async () => {
        const q = this.value.trim();
        if (q) {
          try {
            const url = currentUser ? '/api/flowers?user_id=' + currentUser.id + '&search=' + encodeURIComponent(q) : '/api/flowers?search=' + encodeURIComponent(q);
            const data = await api(url);
            allFlowers = data.flowers;
          } catch (e) { /* keep existing */ }
        } else {
          try {
            await loadFlowers();
          } catch (e) { /* keep existing */ }
        }
        renderFlowerGrid();
      }, 300);
    });
  }
});

// ==================== INIT ====================
(async function init() {
  const saved = localStorage.getItem('flower_user');
  if (saved) {
    try {
      const user = JSON.parse(saved);
      // Verify user still exists by calling profile API
      const data = await api(`/api/user/${user.id}/profile`);
      currentUser = data.user;
      enterApp();
      return;
    } catch (e) {
      localStorage.removeItem('flower_user');
    }
  }
  document.getElementById('authPage').classList.add('show');
  document.getElementById('mainApp').style.display = 'none';
})();
</script>
